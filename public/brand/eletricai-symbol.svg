<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <!-- Metallic E Gradient -->
    <linearGradient id="metalE" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="25%" stop-color="#94A3B8" />
      <stop offset="50%" stop-color="#475569" />
      <stop offset="75%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Metallic Highlight Bevel -->
    <linearGradient id="metalBevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#94A3B8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.8" />
    </linearGradient>

    <!-- Industrial Electric Orange Bolt Gradient -->
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF7ED" />
      <stop offset="20%" stop-color="#FDBA74" />
      <stop offset="50%" stop-color="#FF6B00" />
      <stop offset="85%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#9A3412" />
    </linearGradient>

    <!-- Core Glow Filter -->
    <filter id="boltGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Glow Behind Symbol -->
  <circle cx="60" cy="60" r="50" fill="#FF6B00" opacity="0.12" filter="blur(16px)" />

  <!-- Base Shadow for 3D Depth -->
  <path
    d="M 28 20 L 98 20 L 98 40 L 58 40 L 58 50 L 90 50 L 90 70 L 58 70 L 58 80 L 98 80 L 98 100 L 28 100 Z"
    fill="#05080E"
    opacity="0.8"
    transform="translate(3, 4)"
  />

  <!-- Main Metallic Letter 'E' Body -->
  <path
    d="M 26 18 L 96 18 L 96 38 L 56 38 L 56 49 L 88 49 L 88 69 L 56 69 L 56 80 L 96 80 L 96 100 L 26 100 Z"
    fill="url(#metalE)"
  />

  <!-- Chiseled Inner Bevel Details on 'E' -->
  <!-- Top horizontal facet -->
  <polygon points="26,18 96,18 92,23 32,23 32,95 26,100" fill="#FFFFFF" opacity="0.4" />
  <!-- Upper inner edge -->
  <polygon points="56,38 96,38 92,43 56,43" fill="#0F172A" opacity="0.6" />
  <!-- Middle arm facets -->
  <polygon points="56,49 88,49 84,53 56,53" fill="#FFFFFF" opacity="0.3" />
  <polygon points="56,69 88,69 84,65 56,65" fill="#0F172A" opacity="0.7" />
  <!-- Bottom arm facet -->
  <polygon points="56,80 96,80 92,84 56,84" fill="#FFFFFF" opacity="0.25" />
  <polygon points="26,100 96,100 92,96 32,96" fill="#05080E" opacity="0.8" />

  <!-- Right Chamfer cuts on the 3 bars of 'E' -->
  <polygon points="96,18 96,28 91,38 96,38" fill="#475569" opacity="0.5" />
  <polygon points="88,49 88,57 83,69 88,69" fill="#475569" opacity="0.5" />
  <polygon points="96,80 96,90 91,100 96,100" fill="#475569" opacity="0.5" />

  <!-- Electric Energy Core Aura (Pre-bolt) -->
  <path
    d="M 74 12 L 38 60 L 62 60 L 26 110 L 52 110 L 88 56 L 64 56 Z"
    fill="#FF6B00"
    opacity="0.3"
    filter="url(#boltGlow)"
  />

  <!-- High-Voltage Lightning Bolt Slicing Through 'E' -->
  <!-- Outer Bolt Contour (Industrial Edge) -->
  <polygon
    points="82,8 34,62 58,62 16,114 46,114 94,54 70,54"
    fill="#EA580C"
  />

  <!-- Main Radiant Bolt Body -->
  <polygon
    points="80,10 36,60 60,60 20,110 44,110 92,54 68,54"
    fill="url(#boltGrad)"
  />

  <!-- Bright Core Electric Filament (White-Hot Spark) -->
  <polygon
    points="77,14 41,58 61,58 29,105 40,105 85,55 67,55"
    fill="#FFFBEB"
    opacity="0.85"
  />

  <!-- Sharp Spark Points and Reflection Accents -->
  <circle cx="80" cy="10" r="2" fill="#FFFFFF" />
  <circle cx="20" cy="110" r="2" fill="#FFEDD5" />
  <circle cx="60" cy="60" r="2.5" fill="#FFFFFF" />
</svg>
