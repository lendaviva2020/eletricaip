name: CI — Test & Lint

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        run: bun run format:check

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Security — Dependency Audit & Source Secret Check
        run: |
          bun audit --audit-level=critical
          ! grep -rn --exclude-dir=__tests__ "egw_token_lab_ete_secret_123\|SECRET_ELETRICAI_PRIVATE_RELEASE_SIGNER\|ELETRICAI_REMOTE_CONFIG_SIGNING_KEY" src/

      - name: Tests
        run: bun run test

      - name: Production build & Client Bundle Secret Scan
        run: |
          bun run build
          ! grep -rn "egw_token_lab_ete_secret_123\|SERVICE_ROLE_KEY\|STRIPE_WEBHOOK_SECRET\|MP_ACCESS_TOKEN" .vercel/output/static/

  deploy-supabase:
    needs: quality
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy Supabase Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy ai-industrial-architect \
            --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
          supabase functions deploy stripe-webhook \
            --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} \
            --no-verify-jwt

  deploy-vercel:
    needs: quality
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          bunx vercel --prod \
            --token=${{ secrets.VERCEL_TOKEN }} \
            --yes
